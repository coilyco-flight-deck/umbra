# Words this repo means as written. The hook reports rather than rewrites, so an
# entry here is a claim that the flagged spelling is correct, not a silencer.

[files]
# Vendored upstream API specs. Their text belongs to the publisher, and editing
# it would make the fixtures stop matching what the real service returns.
extend-exclude = ["http/specverb/testdata/"]

[default]
# The HTTP method, pluralised. typos reads the CONNEC inside CONNECTs as a
# misspelt CONNECT and would rewrite the method name itself.
# ser8 is a real host in the fleet, named in an execverb test. typos reads the
# ser inside it as a misspelt set and would rewrite the machine's name.
extend-ignore-identifiers-re = ["CONNECTs?", "ser8"]

[default.extend-words]
# TestMapTypeFailsClosed feeds "objekt" as a type that does not exist. Correcting
# it to "object" would make the test assert the opposite of what it is for.
objekt = "objekt"
# A standard variant, used in version.go's own prose.
unparseable = "unparseable"

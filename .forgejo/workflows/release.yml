# Stage 2 of the two-stage release flow (ward#1117): promote.yml gates every
# main push, publishes the commit-scoped draft tag (`draft-${sha}`), and then
# fast-forwards `release` when green; this pipeline runs on `release` pushes
# only, under a concurrency queue (cancel-in-progress: false) so promoted
# shas release in sequence instead of overlap-and-cancel. A workflow_dispatch
# re-fires it against the `release` ref on a missed enqueue. There is no test
# job here: promote.yml already ran the full repo gate on the exact sha it
# fast-forwarded, so re-running the suite on `release` only lets a flaky rerun
# fail an already-vouched promotion (Kai's call, 2026-07-12).

name: release

on:
  push:
    branches: [release]
  workflow_dispatch:

concurrency:
  group: release-pipeline
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    runs-on: docker
    container: forgejo.coilysiren.me/coilyco-flight-deck/agentic-os:release
    outputs:
      tag: ${{ steps.tag.outputs.new_tag }}
      version: ${{ steps.tag.outputs.new_version }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - id: draft
        name: Derive the draft release tag
        run: echo "draft_tag=draft-${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - name: Verify the draft release tag was published on main
        env:
          DRAFT_TAG: ${{ steps.draft.outputs.draft_tag }}
        run: bash scripts/ci/verify-draft-tag.sh

      - id: tag
        uses: coilysiren/agentic-os/actions/tag-bump@main

      - name: Build packaged specgen CLI and package metadata
        if: ${{ steps.tag.outputs.new_tag != '' }}
        env:
          VERSION: ${{ steps.tag.outputs.new_tag }}
        run: bash scripts/ci/release-artifacts.sh

      - id: create
        if: ${{ steps.tag.outputs.new_tag != '' }}
        uses: coilysiren/agentic-os/actions/create-release@main
        with:
          tag: ${{ steps.tag.outputs.new_tag }}
          name: ${{ steps.tag.outputs.new_tag }}
          body: ${{ steps.tag.outputs.changelog }}

      - name: Upload specgen-linux-amd64
        if: ${{ steps.tag.outputs.new_tag != '' }}
        uses: coilysiren/agentic-os/actions/upload-release-asset@main
        with:
          release_id: ${{ steps.create.outputs.release_id }}
          file: dist/specgen-linux-amd64

      - name: Upload specgen-linux-arm64
        if: ${{ steps.tag.outputs.new_tag != '' }}
        uses: coilysiren/agentic-os/actions/upload-release-asset@main
        with:
          release_id: ${{ steps.create.outputs.release_id }}
          file: dist/specgen-linux-arm64

      - name: Upload specgen-darwin-amd64
        if: ${{ steps.tag.outputs.new_tag != '' }}
        uses: coilysiren/agentic-os/actions/upload-release-asset@main
        with:
          release_id: ${{ steps.create.outputs.release_id }}
          file: dist/specgen-darwin-amd64

      - name: Upload specgen-darwin-arm64
        if: ${{ steps.tag.outputs.new_tag != '' }}
        uses: coilysiren/agentic-os/actions/upload-release-asset@main
        with:
          release_id: ${{ steps.create.outputs.release_id }}
          file: dist/specgen-darwin-arm64

      - name: Upload specgen-windows-amd64
        if: ${{ steps.tag.outputs.new_tag != '' }}
        uses: coilysiren/agentic-os/actions/upload-release-asset@main
        with:
          release_id: ${{ steps.create.outputs.release_id }}
          file: dist/specgen-windows-amd64.exe

      - name: Upload specgen-windows-arm64
        if: ${{ steps.tag.outputs.new_tag != '' }}
        uses: coilysiren/agentic-os/actions/upload-release-asset@main
        with:
          release_id: ${{ steps.create.outputs.release_id }}
          file: dist/specgen-windows-arm64.exe

      - name: Upload SHA256SUMS
        if: ${{ steps.tag.outputs.new_tag != '' }}
        uses: coilysiren/agentic-os/actions/upload-release-asset@main
        with:
          release_id: ${{ steps.create.outputs.release_id }}
          file: dist/SHA256SUMS

      - name: Upload specgen Homebrew formula
        if: ${{ steps.tag.outputs.new_tag != '' }}
        uses: coilysiren/agentic-os/actions/upload-release-asset@main
        with:
          release_id: ${{ steps.create.outputs.release_id }}
          file: dist/specgen.rb

      - name: Upload specgen Scoop manifest
        if: ${{ steps.tag.outputs.new_tag != '' }}
        uses: coilysiren/agentic-os/actions/upload-release-asset@main
        with:
          release_id: ${{ steps.create.outputs.release_id }}
          file: dist/specgen.json

      - name: Update the Homebrew tap
        if: ${{ steps.tag.outputs.new_tag != '' }}
        env:
          TAP_WRITE_TOKEN: ${{ secrets.TAP_WRITE_TOKEN }}
          TAG: ${{ steps.tag.outputs.new_tag }}
        run: bash scripts/ci/update-homebrew-tap.sh

      - name: Update the Scoop bucket
        if: ${{ steps.tag.outputs.new_tag != '' }}
        env:
          SCOOP_WRITE_TOKEN: ${{ secrets.SCOOP_WRITE_TOKEN }}
          TAG: ${{ steps.tag.outputs.new_tag }}
        run: bash scripts/ci/update-scoop-bucket.sh

      - name: Alert Telegram on release failure
        if: ${{ failure() && github.ref == 'refs/heads/release' }}
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ secrets.TELEGRAM_RED_CHAT_ID }}
          REPO: ${{ github.repository }}
          WORKFLOW: ${{ github.workflow }}
          JOB: ${{ github.job }}
          REF: ${{ github.ref }}
          SHA: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          API_BASE: https://api.telegram.org
        run: python3 scripts/ci/telegram-alert-release.py
      - name: Alert Telegram on main failure
        if: ${{ failure() && github.ref == 'refs/heads/main' }}
        continue-on-error: true
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ secrets.TELEGRAM_RED_CHAT_ID }}
          REPO: ${{ github.repository }}
          WORKFLOW: ${{ github.workflow }}
          JOB: ${{ github.job }}
          REF: ${{ github.ref }}
          SHA: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          API_BASE: https://api.telegram.org
        run: python3 scripts/ci/telegram-alert.py

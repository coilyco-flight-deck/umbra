# Stage 1 of the two-stage release flow (ward#1117): every main push re-runs
# the full repo gate here (the same suite ci.yml enforces: vet, build, race
# test, godoc-current, mod tidy, golangci-lint, secret scan), publishes the
# commit-scoped draft tag (`draft-${sha}`), and only then fast-forwards
# `release` to that sha. release.yml then runs on the `release` push (stage 2:
# no re-gate, verify the draft tag, cut the Forgejo release) under a no-cancel
# concurrency queue. main stays the integration branch; `release` is
# last-known-good. Bursts on main collapse to the newest sha
# (cancel-in-progress: true - promotion is idempotent and a newer gate
# supersedes an older one). The promote push uses CI_RELEASE_TOKEN (real-user
# PAT with write:repository + read:user from SSM /forgejo/ci-release-token):
# job-token pushes and PATs without read:user are recorded with an empty actor
# and silently enqueue no workflow, which is how releases go missing. The
# checkout sets persist-credentials: false because checkout otherwise stores
# the job token as an http extraheader in the local git config, and that
# Authorization header overrides the PAT in the promote push URL - the push
# then lands as the internal Actions user, whose pushes Forgejo deliberately
# never enqueues workflows for. With it off, the push authenticates as the
# PAT user and stage 2 fires (ward#1117).

name: promote

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: promote-main
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  gate-and-promote:
    runs-on: docker
    timeout-minutes: 15
    container:
      image: forgejo.coilysiren.me/coilyco-flight-deck/agentic-os:release
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: go vet
        run: go vet ./...

      - name: go build
        run: go build ./...

      - name: go test
        run: go test -race -count=1 ./...

      - name: godoc-current.txt up to date
        run: ./scripts/check-godoc-current.sh

      - name: go.mod tidy
        run: bash scripts/ci/go-mod-tidy.sh

      - name: golangci-lint
        timeout-minutes: 5
        run: golangci-lint run --timeout=5m ./...

      - name: Scan filesystem for secrets
        run: bash scripts/ci/trufflehog-scan.sh

      - name: Publish draft release tag
        env:
          PROMOTE_TOKEN: ${{ secrets.CI_RELEASE_TOKEN }}
          REPO: ${{ github.repository }}
          SERVER: ${{ github.server_url }}
        run: bash scripts/ci/publish-draft-tag.sh

      - name: Promote main to release (fast-forward only)
        env:
          PROMOTE_TOKEN: ${{ secrets.CI_RELEASE_TOKEN }}
          REPO: ${{ github.repository }}
          SERVER: ${{ github.server_url }}
        run: bash scripts/ci/promote-to-release.sh

      - name: Alert Telegram on main failure
        if: ${{ failure() && github.ref == 'refs/heads/main' }}
        continue-on-error: true
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ secrets.TELEGRAM_RED_CHAT_ID }}
          REPO: ${{ github.repository }}
          WORKFLOW: ${{ github.workflow }}
          JOB: ${{ github.job }}
          REF: ${{ github.ref }}
          SHA: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          API_BASE: https://api.telegram.org
        run: python3 scripts/ci/telegram-alert.py
